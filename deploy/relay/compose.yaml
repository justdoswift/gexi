# gexi-relay on a server you own.
#
#   mkdir -p data && sudo chown -R 65532:65532 data
#   docker compose run --rm relay init
#   docker compose up -d
#
# `init` prints the address, tunnel, token and fingerprint to paste into
# gexi › Settings › Remote › Self-hosted relay.
services:
  relay:
    build:
      context: ../..
      dockerfile: deploy/relay/Dockerfile
    image: gexi-relay:latest
    restart: unless-stopped
    ports:
      # Clients reach the tunnel here. Put it on 127.0.0.1:47824 instead and
      # let your HTTPS proxy in front of it.
      - "47824:47824"
      # gexi hosts dial in here, over TLS.
      - "47825:47825"
    volumes:
      - ./data:/data
